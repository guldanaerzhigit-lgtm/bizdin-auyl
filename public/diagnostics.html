<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b3b">
<title>BIZDIŃ AÝYL — Диагностика</title>
<style>
:root{font-family:Arial,sans-serif;color:#20372f;background:#f3f6f2}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:850px;margin:auto}.head{background:#174b3b;color:white;padding:22px;border-radius:18px}.head h1{margin:0 0 8px;font-size:23px}.head p{margin:0;color:#d6e5db;font-size:13px}.panel{background:white;border:1px solid #e2eae2;border-radius:15px;padding:17px;margin-top:15px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.status{font-weight:bold;font-size:13px}.ok{color:#237347}.bad{color:#b53b32}.muted{color:#829087;font-size:12px}button{border:0;border-radius:10px;background:#174b3b;color:white;padding:11px 14px;font-weight:bold;margin:5px 5px 5px 0}button.secondary{background:#e9efe9;color:#244b38}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f5;padding:13px;border-radius:10px;font-size:12px;line-height:1.5}.error{border-left:4px solid #c55b4c;padding:10px 12px;margin:10px 0;background:#fff8f6;border-radius:7px}.error b{font-size:12px}.error pre{margin:7px 0 0}.empty{padding:18px;text-align:center;color:#728177;font-size:13px}.checks{display:grid;gap:9px}.check{font-size:13px;padding:9px;background:#f7f9f6;border-radius:8px}
</style>
</head>
<body><main class="wrap">
<header class="head"><h1>BIZDIŃ AÝYL · Диагностика</h1><p>Бұл бет сайттағы JavaScript қателерін, жүктелмеген файлдарды және браузер күйін көрсетеді.</p></header>
<section class="panel"><div class="row"><b>Жалпы күй</b><span id="summary" class="status">Тексерілуде…</span></div><p class="muted">Егер негізгі бет ақ экран болып қалса, осы диагностикалық бетті ашыңыз.</p><button onclick="runChecks()">Қайта тексеру</button><button class="secondary" onclick="location.href='/'">Сайтты ашу</button><button class="secondary" onclick="copyReport()">Есепті көшіру</button><button class="secondary" onclick="clearErrors()">Қателерді тазалау</button></section>
<section class="panel"><b>Техникалық тексеру</b><div id="checks" class="checks" style="margin-top:12px"></div></section>
<section class="panel"><div class="row"><b>Тіркелген қателер</b><span id="count" class="muted"></span></div><div id="errors"></div></section>
<section class="panel"><b>Браузер ақпараты</b><pre id="info"></pre></section>
</main>
<script>
const KEY='bizdin_auyl_runtime_errors';
function readErrors(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function runChecks(){
 const checks=[
 ['Браузер JavaScript',typeof window!=='undefined'],
 ['LocalStorage',(()=>{try{localStorage.setItem('__test','1');localStorage.removeItem('__test');return true}catch(e){return false}})()],
 ['Негізгі HTML құжаты',!!document.doctype],
 ['Диагностика беті',true]
 ];
 document.getElementById('checks').innerHTML=checks.map(([n,ok])=>'<div class="check">'+(ok?'✅':'❌')+' '+esc(n)+' — '+(ok?'OK':'Қате')+'</div>').join('');
 const errs=readErrors();
 document.getElementById('count').textContent=errs.length+' қате';
 document.getElementById('summary').textContent=errs.length?('ҚАТЕ: '+errs.length):'Жазылған қате жоқ';
 document.getElementById('summary').className='status '+(errs.length?'bad':'ok');
 document.getElementById('errors').innerHTML=errs.length?errs.slice().reverse().map(e=>'<div class="error"><b>'+esc(e.type)+' · '+esc(e.time)+'</b><pre>'+esc(e.message)+(e.extra?'\n'+esc(e.extra):'')+'\nURL: '+esc(e.url)+'</pre></div>').join(''):'<div class="empty">Бұл браузерде әзірге қате тіркелмеген. Егер басты бет ақ болса, басты бетті осы браузерде қайта ашып, кейін осы бетке оралыңыз.</div>';
 document.getElementById('info').textContent='URL: '+location.origin+'\nUser agent: '+navigator.userAgent+'\nLanguage: '+navigator.language+'\nTime: '+new Date().toISOString()+'\nScreen: '+screen.width+'x'+screen.height;
}
function copyReport(){const report={errors:readErrors(),browser:document.getElementById('info').textContent};const txt=JSON.stringify(report,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('Есеп көшірілді!')).catch(()=>prompt('Есепті көшіріңіз:',txt))}else prompt('Есепті көшіріңіз:',txt)}
function clearErrors(){localStorage.removeItem(KEY);runChecks()}
window.addEventListener('error',e=>{try{const a=readErrors();a.push({time:new Date().toISOString(),type:'Diagnostics page error',message:e.message,extra:e.filename+':'+e.lineno,url:location.href});localStorage.setItem(KEY,JSON.stringify(a.slice(-100)))}catch(_){}runChecks()});
window.addEventListener('unhandledrejection',e=>{try{const a=readErrors();a.push({time:new Date().toISOString(),type:'Diagnostics page promise rejection',message:e.reason?.stack||e.reason,url:location.href});localStorage.setItem(KEY,JSON.stringify(a.slice(-100)))}catch(_){}runChecks()});
runChecks();
</script></body></html>
